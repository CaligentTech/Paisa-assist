<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PAISA assist | Disbursing Happiness</title>
    <meta name="description"
        content="Loans, insurance and investment solutions from 50+ leading banks and financial institutions. Zero service charge on loan consultancy." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
</head>

<body>

    <!-- HERO -->
    <header class="hero" id="home">

        <!-- LEFT: blue panel (background is an image the client can swap) -->
        <div class="hero-left">
            <picture>
                <!-- Mobile view (900px and below) -->
                <source media="(max-width: 900px)" srcset="images/hero-bg-mobile.jpeg" />
                <!-- Desktop view (default) -->
                <img class="hero-bg" src="images/hero-bg-desktop.jpeg" alt="" />
            </picture>

            <nav class="nav" aria-label="Main navigation">
                <ul>
                    <li><a href="index.html" aria-current="page">Home</a></li>
                    <li><a href="about.html">About Us</a></li>
                    <li><a href="services.html">Services</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </nav>

            <div class="hero-brand">
                <img class="hero-brand__logo" src="images/logo-white.png" alt="PAISA assist" />
                <p class="tagline"><span>Disbursing Happiness</span></p>
            </div>

            <p class="hero-foot"><span>Your Financial Goals, Our Expert Support</span></p>
        </div>

        <!-- RIGHT: white panel -->
        <div class="hero-right">
            <a href="index.html" class="hero-right__logo" aria-label="PAISA assist home">
                <img src="images/logo.png" alt="PAISA assist" />
            </a>

            <div class="cards">
                <a href="services.html#loans" class="card card--loans">
                    <span class="card__icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 3 3 8l9 5 9-5-9-5Z" />
                            <path d="m3 12 9 5 9-5" />
                            <path d="m3 16 9 5 9-5" />
                        </svg>
                    </span>
                    <span class="card__text">
                        <strong>Loans</strong>
                        <small>Get instant loans for your needs</small>
                    </span>
                    <span class="card__arrow" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path d="M7 17 17 7" />
                            <path d="M8 7h9v9" />
                        </svg>
                    </span>
                </a>

                <!-- Space reserved for the animation your boss will add -->
                <div class="hero-visual" id="hero-animation"></div>

                <a href="services.html#insurance" class="card card--small">
                    <span class="card__icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5l-8-3Z" />
                        </svg>
                    </span>
                    <span class="card__text">
                        <strong>Insurance</strong>
                        <small>Protect what matters most</small>
                    </span>
                </a>

                <a href="services.html#investments" class="card card--small">
                    <span class="card__icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <rect x="4" y="13" width="4" height="7" rx="1" />
                            <rect x="10" y="9" width="4" height="11" rx="1" />
                            <rect x="16" y="4" width="4" height="16" rx="1" />
                        </svg>
                    </span>
                    <span class="card__text">
                        <strong>SIP</strong>
                        <small>Build long-term wealth, steadily</small>
                    </span>
                </a>
            </div>

            <div class="socials">
                <a href="#" aria-label="X (Twitter)">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path
                            d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z" />
                    </svg>
                </a>
                <a href="#" aria-label="Instagram">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="18" height="18" rx="5" />
                        <circle cx="12" cy="12" r="4" />
                        <circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none" />
                    </svg>
                </a>
                <a href="#" aria-label="Facebook">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path
                            d="M14 8.5V6.9c0-.7.2-1.1 1.2-1.1H17V2.5h-2.6C11.6 2.5 10.5 4.2 10.5 6.6v1.9H8v3.3h2.5v9.7H14v-9.7h2.6l.4-3.3H14Z" />
                    </svg>
                </a>
            </div>
        </div>

    </header>

    <script src="js/main.js"></script>
</body>

</html>
