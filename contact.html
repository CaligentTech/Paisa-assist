<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us | PAISA assist</title>
    <meta name="description"
        content="Reach out to PAISA assist for loans, insurance and investment solutions. Visit our Kadavanthra, Ernakulam office or send us a message." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
</head>

<body>

    <!-- HEADER (same navbar style as the other inner pages) -->
    <header class="site-header">
        <nav class="site-nav" aria-label="Main navigation">
            <a href="index.html" class="site-nav__logo" aria-label="PAISA assist home">
                <img src="images/logo-white.png" alt="PAISA assist" />
            </a>
            <ul class="site-nav__list">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="contact.html" aria-current="page">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- CONTACT -->
    <main class="contact">
        <div class="container contact__grid">

            <!-- LEFT: form -->
            <section class="contact-form" aria-labelledby="contact-title">
                <h1 id="contact-title" class="contact-form__title">Reach out to us to get any Financial solutions</h1>
                <p class="contact-form__sub">Send us a message and we will get back to you.</p>

                <!--
                    To receive submissions, replace the action URL with your own endpoint,
                    e.g. a Formspree form (https://formspree.io) or Web3Forms.
                -->
                <form action="https://formspree.io/f/YOUR_FORM_ID" method="POST" class="form">

                    <div class="field">
                        <label for="name">Your name <span class="req" aria-hidden="true">*</span></label>
                        <input type="text" id="name" name="name" autocomplete="name" required />
                    </div>

                    <div class="field">
                        <label for="phone">Your mobile number</label>
                        <input type="tel" id="phone" name="phone" autocomplete="tel" placeholder="+91"
                            inputmode="tel" />
                    </div>

                    <div class="field">
                        <label for="email">Your email address <span class="req" aria-hidden="true">*</span></label>
                        <input type="email" id="email" name="email" autocomplete="email" required />
                    </div>

                    <div class="field">
                        <label for="message">Message <span class="req" aria-hidden="true">*</span></label>
                        <textarea id="message" name="message" rows="3" required></textarea>
                    </div>

                    <div class="form__actions">
                        <button type="submit" class="form__submit">Submit</button>
                    </div>
                </form>
            </section>

            <!-- RIGHT: office card -->
            <aside class="office" aria-labelledby="office-title">
                <h2 id="office-title" class="office__title">Our Office</h2>

                <div class="office__row">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" aria-hidden="true">
                        <path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21Z" />
                        <circle cx="12" cy="9.5" r="2.5" />
                    </svg>
                    <address>
                        Level 4, Santhi Emerald Building, Cheruparambath Road, Kadavanthra, Opp Samsung Service
                        Center, Ernakulam 682020
                    </address>
                </div>

                <div class="office__row office__row--phone">
                    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                        <path
                            d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25c1.1.37 2.3.57 3.6.57a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.6a1 1 0 0 1-.25 1l-2.2 2.2Z" />
                    </svg>
                    <a href="tel:+919090990939">90909 90939</a>
                </div>

                <a class="office__btn" target="_blank" rel="noopener"
                    href="https://www.google.com/maps/search/?api=1&query=Santhi+Emerald+Building+Cheruparambath+Road+Kadavanthra+Ernakulam+682020">
                    Get Directions
                </a>
            </aside>

        </div>
    </main>

</body>

</html>
